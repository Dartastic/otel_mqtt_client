name: otel_mqtt_client
description: OpenTelemetry instrumentation for `package:mqtt_client`.
  Helpers around MqttClient.connect / publishMessage / subscribe with
  messaging.* semconv spans.
version: 0.2.0
repository: https://github.com/dartastic/otel_mqtt_client
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1
  mqtt_client: ^10.0.0
  typed_data: ^1.3.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
  test: ^1.26.3
